<!doctype html>
<html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>B&amp;C RPE Issue – DeWalt PAPR</title><meta name="theme-color" content="#14233f">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<link rel="stylesheet" href="engine.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script src="engine.js"></script></head><body>
<script>
/* Checks taken from the DeWalt DXPGH2SB21 / DXPGB2WD21 user manual (pre-use flow check, HEPA filter fitting and checking,
   low airflow indicator check, filter replacement) and DeWalt support guidance (helmet in-use life 5 years; annual service). */
const C=(id,q)=>({id,q});
BC.start({
  key:"papr",keyParam:"unit",ref:"HS-FORM-012",refNote:"proposed reference – to be confirmed",ver:"v0.1 draft",issue:"07/11/2026",review:"22/04/2027",status:"Draft – online form, awaiting registration",
  title:"RPE Issue & Daily Check – DeWalt PAPR",short:"RPE PAPR Issue",tag:"on issue, every day of use, and on return",
  dateField:"wc",keep:["name","serial","issued","batt"],
  nameSuffix:S=>"wc "+(S.v.name||""),
  init(S,api){if(!S.v.wc)S.v.wc=api.iso(api.mondayOf(new Date()));if(!S.v.issued)S.v.issued=api.iso(new Date());if(!S.eq.items.length)S.eq.items.push({uid:"papr",desc:"DeWalt PAPR with hard hat, P3 HEPA filter (DXPGH2SB21)",eid:S.v.serial||"",r:{},ini:{},c:""})},
  onField(id,S){if(id==="serial"&&S.eq.items[0])S.eq.items[0].eid=S.v.serial},
  onNew(S,old){S.v.wc=BC.api.iso(BC.api.mondayOf(new Date()));S.eq.items=[{uid:"papr"+Date.now(),desc:"DeWalt PAPR with hard hat, P3 HEPA filter (DXPGH2SB21)",eid:old.v.serial||"",r:{},ini:{},c:""}]},
  pdfIntro:"Upon issue of any RPE it is the wearer's responsibility to make sure it is fit for purpose at all times. All RPE is checked on a daily basis before use and any item damaged, lost or stolen is reported to the management immediately. DO NOT undertake any works without the correct RPE for the job. The DeWalt PAPR is a loose-fitting powered respirator (EN 12941 TH3P) with a P3 HEPA filter: it protects against dust and particulates only and gives NO protection against organic vapour (HR-FORM-007; HS-POL-001). No face-fit test is needed. Monthly examination is recorded on HS-FORM-004; the unit is serviced annually; the hard hat is replaced 5 years after first issue or after any impact.",
  pdfKey:"Key: OK = check passed. FAULT = check failed – unit not used, fault reported. n/a = not applicable (e.g. hearing defenders not fitted). Blank = unit not used that day.",
  blocks:[
    {type:"info",html:"<b>Dust and particulates only.</b> The P3 filter gives <b>no protection against vapour</b> (ALSAN, primers, adhesives, solvents in enclosed spaces) – see HR-FORM-007. Do the checks below <b>every day before use</b>. If the low-airflow light comes on at work: <b>stop, leave the dusty area, and change the filter</b>."},
    {type:"fields",id:"iss",title:"Issue details",fields:[
      {id:"name",label:"Name of wearer",req:true},{id:"rpetype",label:"RPE type",kind:"select",req:true,options:["DeWalt PAPR with hard hat & face shield (DXPGH2SB21)","DeWalt PAPR with bump cap & welding visor (DXPGB2WD21)"]},
      {id:"serial",label:"Unit serial / ID number",req:true},{id:"batt",label:"Battery ID(s) issued",placeholder:"e.g. DCB183 2.0Ah no. 1"},
      {id:"issued",label:"Date RPE equipment received",kind:"date",req:true},{id:"hatdate",label:"Hard hat first issued (5-year life from this date)",kind:"date"},
      {id:"filterdate",label:"P3 filter last changed",kind:"date"},{id:"wc",label:"Week commencing (for the daily checks)",kind:"date",req:true}]},
    {type:"equip",id:"chk",title:"Daily pre-use checks",weekField:"wc",fixed:true,catalogue:[],
      intro:"Pick the day, then tick each check. “All OK” fills the blanks for that day.",
      checks:[C("p1","Hard hat shell and head harness / suspension – no cracks, damage or deformation; within 5-year life"),C("p2","Face shield / visor – no cracks or scratches that affect vision; visor protector film fitted"),C("p3","Face seal / skirt (where fitted) – not torn, clean, fitted correctly"),C("p4","P3 HEPA filter – genuine DeWalt, label facing up as worn, seated, not wet, damaged or past change"),C("p5","Pre-filter / odour pre-filter and spark arrestor fitted and clean (spark arrestor furthest upstream)"),C("p6","Air inlet clean and free from obstruction; filter cover secure"),C("p7","Battery charged; battery connector, belt clip and power cord undamaged"),C("p8","Flow check done before use – good airflow into the head-top"),C("p9","Low-airflow / low-battery indicator check done – indicator working"),C("p10","Hearing defenders (where fitted) undamaged and correctly fitted"),C("p11","Cleaned with the cleaning plugs fitted and stored in its case after use")]},
    {type:"fields",id:"ret",title:"Return",intro:"Fill in when the unit comes back.",fields:[{id:"retdate",label:"Date returned",kind:"date"},{id:"retcond",label:"Condition on return",kind:"select",options:["Good – clean, no defects","Defective – see comments","Lost / stolen – reported"]},{id:"retnote",label:"Comments on return",kind:"textarea"}]},
    {type:"sigs",id:"sg",title:"Signatures",decl:"I have received the RPE above and been shown how to check, wear, clean and store it. I understand it protects against dust and particulates only, and I will report any damage, loss or fault straight away.",sigs:[{id:"wr",label:"Wearer"},{id:"isb",label:"Issued / checked by (Build & Cover)",optional:true}]}
  ]
});
</script></body></html>

<!doctype html>
<html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>B&amp;C RPE Issue – DeWalt PAPR</title><meta name="theme-color" content="#14233f">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<link rel="stylesheet" href="engine.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script src="engine.js"></script></head><body>
<script>
/* HS-FORM-012 v0.3 draft 11/11/2026. Unit held: DeWalt DXPGH2SB21 PAPR & hard hat kit (ITS order 13707324, 01/10/2026):
   PAPR with clear visor and hard hat, P3 HEPA filter, hearing defenders (SNR 30), battery connector with belt clip and power cord,
   18V 2.0Ah battery, charger, visor protectors, cleaning plugs, TSTAK case. Checks from the DeWalt DXPGH2SB21 / DXPGB2WD21
   user manual (flow check before every use, low-airflow indicator, HEPA filter fitting) and DeWalt support guidance
   (hard hat in-use life up to 5 years / replace after impact; annual service). */
const C=(id,q)=>({id,q});
const KIT="DeWalt PAPR with hard hat, clear visor and P3 HEPA filter (DXPGH2SB21)";
BC.start({
  key:"papr",keyParam:"unit",ref:"HS-FORM-012",ver:"v0.3 draft",issue:"11/11/2026",review:"22/04/2027",status:"Draft – online form, awaiting Watson & Watson review",
  title:"RPE Issue & Daily Check – DeWalt PAPR",short:"RPE PAPR Issue",tag:"on issue, every day of use, and signed back in on return",
  dateField:"wc",keep:["name","serial","issued","batt"],
  nameSuffix:S=>"wc "+(S.v.name||""),
  init(S,api){const P=api.params;if(P.get("name")&&!S.v.name)S.v.name=P.get("name");if(P.get("wc"))S.v.wc=P.get("wc");if(P.get("serial")&&!S.v.serial)S.v.serial=P.get("serial");if(!S.v.wc)S.v.wc=api.iso(api.mondayOf(new Date()));if(!S.v.issued)S.v.issued=api.iso(new Date());if(!S.v.rpetype)S.v.rpetype=KIT;if(!S.eq.items.length)S.eq.items.push({uid:"papr",desc:KIT,eid:S.v.serial||"",r:{},ini:{},c:""})},
  onField(id,S){if(id==="serial"&&S.eq.items[0])S.eq.items[0].eid=S.v.serial},
  onNew(S,old){S.v.wc=BC.api.iso(BC.api.mondayOf(new Date()));S.v.rpetype=KIT;S.eq.items=[{uid:"papr"+Date.now(),desc:KIT,eid:old.v.serial||"",r:{},ini:{},c:""}]},
  validate(S,p,partial){if(partial)return;const ret=!S.na.ret;if(!ret)return;
    if(!(S.v.retdate||"").trim())p.push("Return: enter the date returned (or tick N/A on the return checks if the unit has not come back yet).");
    [["rw","Returned by (wearer)"],["rc","Checked back in by (Build & Cover)"]].forEach(([id,l])=>{if(!S.sig[id])p.push(`Return sign-off: ${l} – sign in the box.`);if(!(S.v[id+"_name"]||"").trim())p.push(`Return sign-off: ${l} – enter the name.`)})},
  pdfIntro:"Upon issue of any RPE it is the wearer's responsibility to make sure it is fit for purpose at all times. All RPE is checked on a daily basis before use and any item damaged, lost or stolen is reported to the management immediately. DO NOT undertake any works without the correct RPE for the job. The DeWalt PAPR (DXPGH2SB21) is a loose-fitting powered respirator (EN 12941 TH3P) with a P3 HEPA filter: it protects against dust and particulates only and gives NO protection against organic vapour (HR-FORM-007; HS-POL-001). No face-fit test is needed. It is issued with the Equipment Pre-Use Inspection Record (HS-FORM-010, item BT22) and signed back in on return. Monthly examination is recorded on HS-FORM-004; the unit is serviced annually; the hard hat is replaced up to 5 years after first issue or after any impact.",
  pdfKey:"Key: OK = check passed. FAULT = check failed – unit not used, fault reported. n/a = not applicable (part not fitted). Blank = unit not used that day.",
  blocks:[
    {type:"info",html:"<b>Dust and particulates only.</b> The P3 filter gives <b>no protection against vapour</b> (ALSAN, primers, adhesives, solvents in enclosed spaces) – see HR-FORM-007. Fill this in <b>when the PAPR is issued</b>, alongside the Equipment Pre-Use record (BT22). Do the checks below <b>every day before use</b>. If the low-airflow light comes on at work: <b>stop, leave the dusty area, and change the filter</b>. When the unit comes back, complete the <b>Return</b> section and both return signatures."},
    {type:"fields",id:"iss",title:"Issue details",fields:[
      {id:"name",label:"Name of wearer",req:true},{id:"rpetype",label:"RPE type",kind:"select",req:true,options:[KIT]},
      {id:"serial",label:"Unit serial / ID number",req:true,placeholder:"BT22 / serial from the unit label"},{id:"batt",label:"Battery ID(s) issued",placeholder:"e.g. DCB183 2.0Ah no. 1"},
      {id:"issued",label:"Date RPE equipment issued",kind:"date",req:true},{id:"hatdate",label:"Hard hat first issued (5-year life from this date)",kind:"date"},
      {id:"filterdate",label:"P3 filter last changed",kind:"date"},{id:"wc",label:"Week commencing (for the daily checks)",kind:"date",req:true}]},
    {type:"equip",id:"chk",title:"Daily pre-use checks",weekField:"wc",fixed:true,catalogue:[],
      intro:"Pick the day, then tick each check. “All OK” fills the blanks for that day. Use n/a only where a part is not fitted.",
      checks:[C("p1","Hard hat shell and head harness – no cracks, damage or deformation; no impact since issue; within 5-year life"),
        C("p2","Clear visor – no cracks or scratches that affect vision; visor protector film fitted and clean"),
        C("p3","All parts present and secure – no missing clips, press studs or screws; face cover / seal (if fitted) not torn"),
        C("p4","P3 HEPA filter – genuine DeWalt, label facing up as worn, seated, not wet, damaged or due for change"),
        C("p5","Filter cover secure; air inlet clean and unobstructed; pre-filter / spark arrestor (if fitted) clean and correctly placed"),
        C("p6","Battery charged; battery connector, belt clip and power cord undamaged and connected"),
        C("p7","Flow check done before use – good airflow into the head-top"),
        C("p8","Low-airflow / low-battery indicator check done – indicator working"),
        C("p9","Hearing defenders (SNR 30, supplied with the kit) undamaged and fitted where noise needs them"),
        C("p10","After use: cleaned with the cleaning plugs fitted, charged and stored in its case")]},
    {type:"checks",id:"ret",title:"Return – checks",na:true,allYes:true,
      intro:"Fill in when the unit comes back. Tick N/A (top right) if it has not been returned yet this week.",
      items:[{id:"r1",q:"Unit cleaned, with the cleaning plugs fitted",no:"Clean it before it is stored"},
        {id:"r2",q:"Hard hat, visor and harness undamaged; no impact while issued",no:"Quarantine – do not reissue"},
        {id:"r3",q:"P3 HEPA filter in good condition (or changed – date recorded above)",no:"Change the filter before reissue"},
        {id:"r4",q:"Battery, charger, battery connector / belt clip and power cord all returned and undamaged",no:"Record what is missing or damaged"},
        {id:"r5",q:"Hearing defenders and spare visor protector films returned",no:"Record what is missing"},
        {id:"r6",q:"Everything back in the TSTAK case and stored clean and dry",no:"Put it back in the case"},
        {id:"r7",q:"Unit fit to reissue",no:"Label DO NOT USE, quarantine and report to Graham"}]},
    {type:"fields",id:"retd",title:"Return – details",fields:[{id:"retdate",label:"Date returned",kind:"date"},{id:"retcond",label:"Condition on return",kind:"select",options:["Good – clean, no defects","Defective – see comments","Lost / stolen – reported"]},{id:"retnote",label:"Comments on return",kind:"textarea"}]},
    {type:"sigs",id:"sg",title:"Issue signatures",decl:"I have received the RPE above and been shown how to check, wear, clean and store it. I understand it protects against dust and particulates only, and I will report any damage, loss or fault straight away.",sigs:[{id:"wr",label:"Wearer (on issue)"},{id:"isb",label:"Issued by (Build & Cover)",optional:true}]},
    {type:"sigs",id:"sr",title:"Return sign-off",decl:"The RPE above has been returned and checked in as recorded in the return section.",sigs:[{id:"rw",label:"Returned by (wearer)",optional:true},{id:"rc",label:"Checked back in by (Build & Cover)",optional:true}]}
  ]
});
</script></body></html>

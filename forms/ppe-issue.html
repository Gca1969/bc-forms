  pdfEnd:"Respiratory protection – two types, not interchangeable. (1) Dust and particulate work: DeWalt PAPR with integrated hard hat and P3 filter – loose-fitting, no face-fit test, pre-use check every time (record on the RPE Issue & Daily Check form); monthly examination on HS-FORM-004. (2) Vapour and chemical work: the P3 filter gives NO protection against organic vapour. In the open air with through-ventilation, no vapour respirator is needed where the product's current SDS calls for RPE only in inadequate ventilation (recorded on the POWRA, HS-FORM-005). Enclosed or unventilated work STOPS and the Director decides; a tight-fitting vapour respirator with the cartridge named in the COSHH assessment (A-type or AX) is issued only after the face-fit hold point is met (face-fit test in date for that make, model and size; wearer clean-shaven at the seal). AX cartridges are single-use. Disposable FFP3 masks are not the Company's dust RPE. If unsure which respirator applies, ask the Director before starting. Full wording: HR-FORM-007.",

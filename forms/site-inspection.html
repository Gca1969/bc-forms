<!doctype html>
<html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>B&amp;C Site Inspection Sheet</title><meta name="theme-color" content="#14233f">

<script src="engine.js"></script></head><body>
<script>
const q=(id,text,no,extra)=>Object.assign({id,q:text,no},extra||{});
const C="Cease task",R="Take remedial action",A="Take action",D="Do not use",I="Inform";
BC.start({
  key:"site",keyParam:"job",ref:"HS-FORM-009",refNote:"proposed reference – to be confirmed",ver:"v0.1 draft",issue:"07/11/2026",review:"22/04/2027",status:"Draft – online form, awaiting registration",
  title:"Site Inspection Sheet",short:"Site Inspection",tag:"every job · every week (as a minimum)",
  dateField:"date",keep:["job","site","rp_name","rp_pos"],
  nameSuffix:S=>"Job "+(S.v.job||"").trim(),
  init(S,api){const p=api.params;if(p.get("job")&&!S.v.job)S.v.job=p.get("job");if(p.get("site")&&!S.v.site)S.v.site=p.get("site");if(!S.v.date)S.v.date=api.iso(new Date());if(!S.v.type)S.v.type="Site"},
  pdfIntro:"The completion of this inspection sheet is to be done for each job location on a weekly basis (as a minimum). Once completed, the PDF is filed in the job folder: 19 Site Records › Weekly Site Inspections.",
  pdfKey:"Key: Yes / No / N/A against each check. Where the answer needs action the action is shown in brackets – Cease task, Do not use, Take (remedial) action, Inform, Contact head office – and what was done is recorded in the comment. A section marked NOT APPLICABLE does not apply to this job this week.",
  blocks:[
    {type:"info",html:"Walk the job once a week (minimum). Answer every line or tick <b>N/A</b> for a whole section that doesn't apply. A red answer needs a note of what was done. Add photos as you go."},
    {type:"fields",id:"det",title:"Details",fields:[
      {id:"job",label:"Job number",req:true,inputmode:"numeric"},{id:"site",label:"Site address",req:true},
      {id:"date",label:"Date of inspection",kind:"date",req:true},{id:"time",label:"Time of inspection",kind:"time"},
      {id:"type",label:"Inspection type",kind:"select",options:["Site","Residential","Other business"]},
      {id:"observed",label:"Names of employees / sub-contractors observed",kind:"textarea",req:true}]},
    {type:"checks",id:"tr",title:"Training",items:[q("tr1","Are the employees / sub-contractors trained for the tasks they are doing?",C)]},
    {type:"checks",id:"ms",title:"Method statement",items:[q("ms1","Method statement applicable?","Contact head office"),q("ms2","Method statement being adhered to?",R)]},
    {type:"checks",id:"ssw",title:"Safe systems of work",items:[q("ssw1","Hazardous work permit applicable (e.g. hot works)?",R,{bad:"-"}),q("ssw2","Hazardous work permit(s) current and updated?",R),q("ssw3","Job pack details up to date?",R),q("ssw4","Sub-surface / services inspections carried out?",R),q("ssw5","Electrical lock-out procedures being adhered to?",R)]},
    {type:"checks",id:"ppe",title:"PPE – personal protective equipment",items:[q("ppe1","Appropriate PPE being used / worn by all employees / sub-contractors?",C),q("ppe2","Have those using PPE been trained in its use and fitting?",C),q("ppe3","Is everyone wearing the appropriate work wear?",C)]},
    {type:"checks",id:"eq",title:"Equipment",items:[q("eq1","Does the equipment carry the appropriate certification of testing (PAT etc.)?",C),q("eq2","Have those using the equipment been trained in its correct operation?",C),q("eq3","Has a visual pre-use inspection been carried out? (check records)","Cease task and carry out a pre-use inspection"),q("eq4","Is the equipment fit for purpose and used for its designated purpose?",C),q("eq5","Is vibration equipment labelled (red, amber, green) and are usage sheets being completed?",C)]},
    {type:"fields",id:"ladfix",title:"Ladders – how secured",intro:"Before using a ladder to work from, consider whether it is the right equipment for the job. Ladders over 5 m must not be footed.",fields:[{id:"lad_secure",label:"Ladder secured by",kind:"select",options:["Tied","Footed (at ALL times during use)","Not applicable – no ladders"]}]},
    {type:"checks",id:"lad",title:"Ladders and stepladders",na:true,items:[q("lad1","Do the ladders / stepladders have a current inspection tag?",D),q("lad2","Have they been pre-use inspected?","Inspection required"),q("lad3","Are they in good working order?","Complete a ladder defect notice"),q("lad4","Positioned in a safe area? (consider collision risk)",A),q("lad5","Standing at 75° (1 out, 4 up)?",A),q("lad6","Extended ladders 1 m above the landing place?",A),q("lad7","Standing on firm, level ground?",A),q("lad8","Securely stored when not in use?",A)]},
    {type:"checks",id:"mewp",title:"Cherry pickers (MEWPs)",na:true,items:[q("mw1","Current inspection tag (thorough examination)?",A),q("mw2","Pre-use inspected? (check the pre-use sheet)",A),q("mw3","Operators hold a valid licence (IPAF / NPORS)?",A),q("mw4","Operators using suitable restraint harnesses?",A),q("mw5","Harnesses have a current inspection tag?",A),q("mw6","Risk assessment done for the MEWP's current use?",A),q("mw7","MEWP used as intended?",A),q("mw8","Used on sound, level ground?",A),q("mw9","Used away from high-level hazards – power cables, trees etc.?",A),q("mw10","Weather conditions suitable for use?",A),q("mw11","Access around the MEWP restricted and signage prominent?",A),q("mw12","Controls against unauthorised use in place and sufficient?",A),q("mw13","Stowed safe and secure when not in use?",A)]},
    {type:"checks",id:"scf",title:"Scaffolding",na:true,intro:"Scaffolding needs re-inspection every 7 days, and after alterations, extensions, collision with machinery or adverse weather.",items:[q("sc1","Current scaff-tag in place?",D),q("sc2","Visually inspected? (check the pre-use inspection sheet)",D),q("sc3","Has the scaffolding been unofficially altered in any way?",A,{bad:"Y"}),q("sc4","Used as per its designed purpose? (loading etc.)",A),q("sc5","Access / egress secured when unattended?",A),q("sc6","Area below restricted and signage prominent?",A)]},
    {type:"checks",id:"twr",title:"Portable scaffold towers",na:true,intro:"Towers need re-inspection every 7 days, and after alterations, extensions, collision or adverse weather.",items:[q("tw1","Current inspection tag?",D),q("tw2","Erected in line with the manufacturer's instructions (PASMA)?",D),q("tw3","Visually inspected? (check the pre-use inspection sheet)",D),q("tw4","On firm level ground with castors locked or base plates properly supported?",D),q("tw5","Risk assessment done for the tower's current use?",D),q("tw6","Only used for its intended purpose?",A),q("tw7","Used away from high-level hazards – power cables, trees etc.?",D),q("tw8","Weather conditions suitable?",D),q("tw9","Access / egress secured when unattended?",A),q("tw10","Access around the tower restricted and signage prominent?",A),q("tw11","Stowed safe and secure when not in use?",A)]},
    {type:"checks",id:"trs",title:"Trestles",na:true,items:[q("ts1","Erected in line with the manufacturer's instructions?",D),q("ts2","Pre-use inspection records up to date and complete?",C),q("ts3","On firm, level ground?",D),q("ts4","Risk assessment done for current use?",D),q("ts5","Only used for its intended purpose?",A),q("ts6","Used away from high-level hazards?",D),q("ts7","Weather conditions suitable?",D),q("ts8","Access around the trestle restricted and signage prominent?",A),q("ts9","Stowed safe and secure when not in use?",A)]},
    {type:"text",id:"oth",title:"Other means of access to the work area",intro:"Describe the method (e.g. roof edge protection, hatch, stair tower, telehandler) and the safety checks made, including ALL precautions. Write N/A if none.",placeholder:"Method and checks…"},
    {type:"checks",id:"asb",title:"Asbestos",na:true,intro:"Work involving the insulation or removal of asbestos must only be carried out by a licensed contractor. Employees / sub-contractors must cease work if they suspect any materials contain asbestos and report it to the nominated responsible person (manager or supervisor).",items:[q("as1","Copy of the asbestos survey available?",A),q("as2","Results of the survey known to the workers?",A),q("as3","Workers aware of what to do if they find unrecorded asbestos?",A),q("as4","Risk assessments and method statements in place and adhered to?",A)]},
    {type:"checks",id:"mat",title:"Materials and substances",na:true,items:[q("mt1","Safety data sheets / COSHH assessments readily available for the materials in use?",A),q("mt2","Materials and substances used for their intended purpose?",A),q("mt3","Stored securely as recommended when not in use?",A),q("mt4","Do materials or substances obstruct access routes or safety equipment?",A,{bad:"Y"}),q("mt5","Labelled correctly?",A)]},
    {type:"checks",id:"pva",title:"Pedestrian and vehicle access",na:true,items:[q("pv1","Pedestrian access segregated from vehicle access?",A),q("pv2","Work areas segregated from unauthorised access?",A),q("pv3","All signage appropriately and prominently fixed?",A)]},
    {type:"checks",id:"hk",title:"Housekeeping",items:[q("hk1","Work areas tidy, clean, uncluttered and dry/wet areas controlled?",A),q("hk2","Welfare equipment kept clean and in a condition suitable for use?",A)]},
    {type:"checks",id:"rest",title:"Rest area facilities",items:[q("rs1","Rest areas appropriate for their use?",A),q("rs2","Welfare equipment kept clean and in a suitable condition?",A)]},

    {type:"checks",id:"fire",title:"Fire safety",items:[q("fs1","Workers aware of the site fire evacuation procedure?",I),q("fs2","Workers aware of the location of the fire assembly point?",I),q("fs3","Workers aware of the site fire warden?",I),q("fs4","Fire extinguishers in place and checked regularly?",I),q("fs5","Workers aware of emergency services contact numbers?",I),q("fs6","Workers aware of the nearest telephone point?",I),q("fs7","Workers aware of the weekly sounding of the fire alarm?",I),q("fs8","Workers aware of site hot works procedures / permits?",I)]},

    {type:"fields",id:"qstd",title:"Quality standards on file (tick if applicable)",fields:[{id:"qs1",label:"Architectural designs / plans & standards",kind:"check"},{id:"qs2",label:"Structural engineering designs & standards",kind:"check"},{id:"qs3",label:"Purchased building material records & inspections",kind:"check"},{id:"qs4",label:"Building control",kind:"check"},{id:"qs5",label:"Building energy performance certificates / standards",kind:"check"},{id:"qs6",label:"Environmental surveys / standards",kind:"check"},{id:"qs7",label:"Other (state)"}]},
    {type:"checks",id:"qual",title:"Quality compliance",na:true,items:[q("qc1","Documented evidence that the applicable standards are being adhered to?",A),q("qc2","Work inspected by an external body / building inspector at each key phase (records on file)?",A),q("qc3","Work inspected by the client / management / supervision at each key phase (records on file)?",A),q("qc4","CDM health & safety file being compiled / in place?",A),q("qc5","Documented evidence of customer / client handover?",A),q("qc6","Documented evidence of a customer complaints procedure?",A),q("qc7","Delivered materials inspected for compliance with the design before use?",A),q("qc8","Non-conforming material rejected / returned to the supplier (documented)?",A),q("qc9","Records of employee training demonstrating competency?",A),q("qc10","Records demonstrating the management team's competency?",A),q("qc11","Records for the vetting of contractors demonstrating their competency?",A),q("qc12","Records demonstrating certification of tools & equipment (test, calibration etc.)?",A)]},
    {type:"text",id:"misc",title:"Miscellaneous observations"},
    {type:"photos",id:"gen",title:"General site photographs",intro:"Overall photos of the work area, access, edge protection, welfare, storage etc."},
    {type:"sigs",id:"sg",title:"Signature of nominated responsible person",sigs:[{id:"rp",label:"Nominated responsible person"}]}
  ],
  validate(S,p,partial){}
});
</script></body></html>
